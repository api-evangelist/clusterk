name: Clusterk
description: >-
  ClusterK was a cloud cost-optimization startup founded in 2013 in Palo Alto,
  California by Dmitry Pushkarev. Its software let AWS users run production and
  batch workloads on Amazon EC2 Spot Instances at up to 90% savings versus
  on-demand pricing, by predicting spot-market prices and continuously
  rebalancing capacity across instance types. ClusterK shipped two products:
  ClusterK Balancer, which arbitraged the AWS Spot Market for cost savings, and
  ClusterK Cirrus, a cloud-native HPC grid scheduler. The company was backed by
  DCVC (Data Collective), Rally Ventures, and the Mayo Clinic Business
  Accelerator, raising roughly $1.2M. Amazon acquired ClusterK in April 2015 and
  absorbed the team and technology into AWS; the company no longer operates
  independently and publishes no public API, SDK, or developer surface. This
  profile is retained as a historical portfolio-company record.
